name: "smartgridx"
version: "1.0.0"
config-version: 2

profile: "smartgridx"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  smartgridx:
    staging:
      +materialized: view
      +tags: ["staging"]

    intermediate:
      +materialized: view
      +tags: ["intermediate"]

    marts:
      +materialized: table
      +tags: ["marts", "gold"]

      dimensions:
        +materialized: table
        +tags: ["dimensions", "gold"]

      facts:
        +materialized: incremental
        +tags: ["facts", "gold"]

      reporting:
        +materialized: table
        +tags: ["reporting", "gold"]

snapshots:
  smartgridx:
    +target_schema: snapshots
    +tags: ["snapshots"]

seeds:
  smartgridx:
    +schema: reference
    +tags: ["seeds"]