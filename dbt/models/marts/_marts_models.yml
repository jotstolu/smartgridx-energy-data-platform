version: 2

models:
  - name: dim_customers
    description: "Customer dimension containing one row per customer."
    columns:
      - name: customer_sk
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: account_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["Active", "Suspended", "Closed"]

  - name: dim_tariffs
    description: "Tariff dimension containing current tariff attributes."
    columns:
      - name: tariff_sk
        data_tests:
          - not_null
          - unique
      - name: tariff_id
        data_tests:
          - not_null
          - unique
      - name: unit_rate_amount_per_kwh
        data_tests:
          - positive_or_zero

  - name: dim_meters
    description: "Meter dimension linking meters to customers and tariffs."
    columns:
      - name: meter_sk
        data_tests:
          - not_null
          - unique
      - name: meter_id
        data_tests:
          - not_null
          - unique
      - name: customer_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
      - name: tariff_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tariffs')
                field: tariff_sk

  - name: dim_regions
    description: "Region dimension built from all regional source tables."
    columns:
      - name: region_sk
        data_tests:
          - not_null
          - unique
      - name: region
        data_tests:
          - not_null
          - unique

  - name: dim_date
    description: "Date dimension for reporting and calendar joins."
    columns:
      - name: date_sk
        data_tests:
          - not_null
          - unique
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: fact_meter_readings
    description: "Incremental fact table containing clean smart meter readings."
    columns:
      - name: meter_reading_sk
        data_tests:
          - not_null
          - unique
      - name: meter_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_meters')
                field: meter_sk
      - name: customer_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
      - name: consumption_kwh
        data_tests:
          - not_null
          - positive_or_zero
      - name: voltage
        data_tests:
          - value_between:
              arguments:
                min_value: 200
                max_value: 260

  - name: fact_billing_events
    description: "Incremental fact table containing validated billing events."
    columns:
      - name: billing_event_sk
        data_tests:
          - not_null
          - unique
      - name: customer_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
      - name: tariff_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tariffs')
                field: tariff_sk
      - name: total_amount
        data_tests:
          - not_null
          - positive_or_zero

  - name: fact_weather_daily
    description: "Daily regional weather fact table."
    columns:
      - name: weather_sk
        data_tests:
          - not_null
          - unique
      - name: region_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_regions')
                field: region_sk

  - name: fact_outage_events
    description: "Incremental fact table containing regional outage events."
    columns:
      - name: outage_sk
        data_tests:
          - not_null
          - unique
      - name: duration_minutes
        data_tests:
          - positive_or_zero

  - name: mart_daily_energy_summary
    description: "Daily regional energy summary mart for executive reporting."
    columns:
      - name: daily_energy_summary_sk
        data_tests:
          - not_null
          - unique
      - name: reading_date
        data_tests:
          - not_null
      - name: region
        data_tests:
          - not_null
      - name: total_consumption_kwh
        data_tests:
          - positive_or_zero

  - name: mart_customer_energy_summary
    description: "Customer-level energy and billing summary mart."
    columns:
      - name: customer_sk
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: total_consumption_kwh
        data_tests:
          - positive_or_zero
      - name: total_billed_amount
        data_tests:
          - positive_or_zero